<title>Workflow Tracer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a summary strip on top, then the bracket (scrolls inside its own panel) beside the step list; stacks on a phone. */
/* Don's Bookshelf design system (dons-bookshelf-design): cream paper, warm ink, one spine accent per role. Light only; the brand has no dark mode yet. */
:root {
  --cream-50: #fdfaf2; --cream-100: #f8f1e1; --cream-200: #efe5cf; --cream-300: #e2d4b6; --ink-900: #2a221c; --ink-500: #6e6056;
  --spine-orange: #fdc689; --orange-deep: #c97a2b; --blue-deep: #1f7fa8; --green-deep: #4f8a48; --salmon-deep: #c75038; --yellow-deep: #b58a14; --brown-deep: #3f2912;
  --bg: var(--cream-100); --panel: var(--cream-50); --fg: var(--ink-900); --muted: var(--ink-500); --line: var(--cream-300); --line-soft: var(--cream-200);
  --accent: var(--orange-deep); --accent-soft: color-mix(in srgb, var(--spine-orange) 45%, var(--panel));   /* the route: a read file, the badge, the dashed line */
  --catalog: var(--blue-deep); --contract: var(--salmon-deep); --factory: var(--green-deep); --product: var(--yellow-deep); --tool: var(--ink-500); --template: var(--brown-deep); --stage: var(--blue-deep);
  --pass: var(--green-deep); --fail: var(--salmon-deep); --warn: var(--yellow-deep);
  --shadow-sm: 0 1px 2px rgba(58, 38, 18, 0.06), 0 1px 1px rgba(58, 38, 18, 0.04); --shadow-xs: 0 1px 0 rgba(58, 38, 18, 0.06);
  --display: "Lora", Georgia, serif; --body: "DM Sans", ui-sans-serif, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --link: var(--blue-deep);
  color-scheme: light;
}
/* Dark: the brand has no dark palette yet, so this is the same room with the lights off. Ink surfaces, cream text, the pastel spines (which the logo uses) as the accents, since the deep ones vanish on ink. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1712; --panel: #2a221c; --fg: #f8f1e1; --muted: #c9b794; --line: #4a3f36; --line-soft: #3a3029;
  --accent: #fdc689; --accent-soft: color-mix(in srgb, #fdc689 22%, #2a221c);
  --catalog: #6dcff6; --contract: #f69679; --factory: #a3d39c; --product: #fff799; --tool: #9b8d80; --template: #c9b794; --stage: #6dcff6;
  --pass: #a3d39c; --fail: #f69679; --warn: #fff799; --link: #6dcff6;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2); --shadow-xs: 0 1px 0 rgba(0, 0, 0, 0.3);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1712; --panel: #2a221c; --fg: #f8f1e1; --muted: #c9b794; --line: #4a3f36; --line-soft: #3a3029;
  --accent: #fdc689; --accent-soft: color-mix(in srgb, #fdc689 22%, #2a221c);
  --catalog: #6dcff6; --contract: #f69679; --factory: #a3d39c; --product: #fff799; --tool: #9b8d80; --template: #c9b794; --stage: #6dcff6;
  --pass: #a3d39c; --fail: #f69679; --warn: #fff799; --link: #6dcff6;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2); --shadow-xs: 0 1px 0 rgba(0, 0, 0, 0.3);
  color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; gap: 12px }
h1 { font: 600 24px/1.15 var(--display); margin: 0; text-wrap: balance }
.credit { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font: 500 12px var(--body); color: var(--muted) }
.credit a { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px }
.credit a:hover { text-decoration-thickness: 2px }
.credit svg { display: inline-block; vertical-align: -3px; margin-right: 4px }
.credit button { margin-left: auto; font: 500 12px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; box-shadow: var(--shadow-xs) }
.strip { flex: none; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-start }
.strip .task { flex: 1 1 320px; min-width: 0 }
.task p { margin: 4px 0 0; color: var(--muted) }
.task code { font: 12px var(--mono); color: var(--fg); word-break: break-all }
.checks { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; max-width: 100% }
.chk { cursor: pointer; font: 500 12px var(--body); color: var(--fg); display: inline-flex; flex-wrap: wrap; max-width: 100%; box-sizing: border-box; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); box-shadow: var(--shadow-xs) }
.chk b { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none }
.chk.pass b { background: var(--pass) } .chk.fail b { background: var(--fail) }
.chk small { color: var(--muted) }
.chk.open, .chk:hover { border-color: var(--accent) }
.why { margin: 0 0 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow-sm); font: 14px/1.5 var(--display); max-width: 100% }
.why.pass { --c: var(--pass) } .why.fail { --c: var(--fail) }
.why h3 { margin: 0 0 4px; font: 600 15px var(--display); color: var(--c, var(--fg)) }
.why p { margin: 4px 0; color: var(--muted) }
.why ol, .why ul { margin: 4px 0 0; padding-left: 20px } .why li { margin: 2px 0 }
.why code { font: 12px var(--mono); word-break: break-all }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; flex: 1 1 auto; min-height: 0 }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(300px, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-sm); min-width: 0; min-height: 0; display: flex; flex-direction: column }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); font-size: 12px }
.bar > * { min-width: 0; max-width: 100% }
.bar button { font: 500 12px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; box-shadow: var(--shadow-xs) }
.bar button:active { transform: translateY(1px); background: var(--bg) }
.bar button:hover { border-color: var(--accent) } .bar button:focus-visible, .steps li:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted) }
.bar input[type=range] { width: 120px; accent-color: var(--accent) }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-left: auto; color: var(--muted); min-width: 0 }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1.5px solid var(--c) ; background: color-mix(in srgb, var(--c) 18%, transparent) }
.scroll { overflow: auto; flex: 1 1 auto; min-height: 320px }
svg { display: block; font-family: var(--body) }
/* Nodes are drawn as the thing they are: a tabbed folder, a page with a turned corner, a stack for "N more". */
.n .shape { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; stroke-linejoin: round }
.n text { font-size: 12px; font-weight: 500; fill: var(--fg); pointer-events: none }
.n.dir .shape { fill: color-mix(in srgb, var(--c) 32%, var(--panel)); stroke: var(--c) }
.n.dir .flap { fill: color-mix(in srgb, var(--c) 16%, var(--panel)); stroke: var(--c); stroke-width: 1.2; stroke-linejoin: round }
.n.dir text { font-weight: 600 }
.n.file .shape { stroke: var(--c) }
.n.file .fold { fill: color-mix(in srgb, var(--c) 18%, var(--panel)); stroke: var(--c); stroke-width: 1.2; stroke-linejoin: round }
.n.file.plain .shape, .n.file.plain .fold { stroke: var(--line) } .n.file.plain .fold { fill: var(--line-soft) }
.n.file .rule { stroke: var(--line-soft); stroke-width: 1 }
.n.more .shape, .n.more .back { fill: var(--panel); stroke: var(--line); stroke-dasharray: 3 2; stroke-width: 1 }
.n .sub { font-size: 10px; fill: var(--muted); font-weight: 400; font-family: var(--mono) }
.n.read .shape, .n.read .fold, .n.read .flap { stroke: var(--accent); stroke-width: 2 }
.n.read .shape { fill: color-mix(in srgb, var(--accent) 16%, var(--panel)) }
.n.read .fold, .n.read .flap { fill: color-mix(in srgb, var(--accent) 34%, var(--panel)) }
.n.now { filter: drop-shadow(0 0 6px var(--accent)) }
.n.named .shape, .n.named .fold { stroke: var(--accent); stroke-dasharray: 4 3 } /* named as an input, checked, not opened */
.chk .short { display: none }
.tag.named { color: var(--accent); border-color: var(--accent) }
.n.toggle { cursor: pointer }
.n.dim { opacity: .45 }
.edge { fill: none; stroke: var(--line); stroke-width: 1.2 }
.edge.on { stroke: var(--c) }
.route { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linecap: round }
.badge circle { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5 }
.badge text { font: 600 10px var(--mono); fill: var(--panel); text-anchor: middle }
.steps { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1 1 auto }
.steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 8px; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); cursor: pointer; align-items: start }
.steps li > * { min-width: 0 }
.steps li:hover { background: var(--bg) }
.steps li.now { background: var(--accent-soft) }
.steps li.future { opacity: .4 }
.steps .num { font: 600 12px var(--mono); color: var(--accent); padding-top: 2px }
.steps .path { font: 12px var(--mono); word-break: break-all; min-width: 0 }
.steps .why { grid-column: 2 / 4; color: var(--muted); font-size: 12px }
.steps .tok { font: 11px var(--mono); color: var(--muted); white-space: nowrap; text-align: right }
.tag { display: inline-block; font: 500 10px var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; vertical-align: 1px }
.tag.L0, .tag.L1 { color: var(--catalog); border-color: var(--catalog) } .tag.L2 { color: var(--contract); border-color: var(--contract) }
.tag.L3 { color: var(--factory); border-color: var(--factory) } .tag.L4 { color: var(--product); border-color: var(--product) }
.tag.scan { color: var(--warn); border-color: var(--warn) } .tag.miss { color: var(--fail); border-color: var(--fail) }
.budget { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--muted) }
.budget .track { height: 6px; background: var(--line-soft); border-radius: 3px; margin-top: 5px; overflow: hidden }
.budget .fill { height: 100%; background: var(--accent); width: 0; transition: width .25s }
.budget .fill.over { background: var(--fail) }
.budget span { font-family: var(--mono); font-variant-numeric: tabular-nums }
.findings { padding: 10px 12px; border-top: 1px solid var(--line-soft); font: 13px/1.5 var(--display) }
.findings strong { font-family: var(--body); font-size: 12px }
.findings ul { margin: 4px 0 0; padding-left: 18px } .findings li { margin: 2px 0 }
.empty { padding: 24px; color: var(--muted); text-align: center }
@media (prefers-reduced-motion: reduce) { .budget .fill { transition: none } }
/* Phone: one panel at a time behind a Tree / Steps switch, thumb-sized controls, notes and legend folded away. */
.seg { display: none }
@media (max-width: 860px) {
  body { gap: 8px; padding-block: 8px }
  h1 { font-size: 19px }
  .credit { font-size: 11px; gap: 4px 10px }
  .task p { margin-top: 2px } .task p:has(code) { display: none }  /* the root path is in the Steps panel's title tooltip; it wraps mid-word here */
  .chk { padding: 3px 8px; font-size: 12px } .chk small, .chk .long { display: none } .chk .short { display: inline }
  .checks { gap: 4px }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel) }
  .seg button { font: 600 13px var(--body); color: var(--muted); background: transparent; border: 0; padding: 10px; cursor: pointer }
  .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--fg) }
  .main { grid-template-rows: 1fr; grid-auto-rows: 0 }
  .main .panel[hidden] { display: none !important }
  .bar { gap: 6px 10px; padding: 8px }
  .bar button { min-height: 36px; min-width: 36px; padding: 6px 10px; font-size: 13px }
  .bar input[type=range] { width: 90px; min-height: 36px }
  .legend { display: none }
  .scroll { min-height: 0; touch-action: pan-x pan-y; overscroll-behavior: contain }
  .steps li { padding: 10px 10px }
  .steps .why { font-size: 12.5px }
}
</style>

<div class="seg" role="tablist" aria-label="Panel">
  <button type="button" role="tab" id="segTree" aria-selected="true">Tree</button>
  <button type="button" role="tab" id="segSteps" aria-selected="false">Steps</button>
</div>

<div class="credit">
  <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 96" width="30" height="14" role="img" aria-label="Don's Bookshelf">  <rect x="20" y="14" width="22" height="68" rx="3" fill="#fdc689"></rect>  <rect x="46" y="18" width="22" height="64" rx="3" fill="#6dcff6"></rect>  <rect x="72" y="22" width="22" height="60" rx="3" fill="#a3d39c"></rect>  <rect x="98" y="14" width="22" height="68" rx="3" fill="#f69679"></rect>  <g transform="rotate(-14 137 82)">    <rect x="137" y="12" width="22" height="70" rx="3" fill="#f5c842"></rect>  </g>  <rect x="0" y="82" width="192" height="5" rx="1.5" fill="#754c24"></rect></svg>Created by <a href="https://donsbookshelf.com/" target="_blank" rel="noopener">Don's Bookshelf</a></span>
  <span>Learn more about ICM at <a href="https://www.skool.com/cliefnotes/about?ref=f4482ac988fb4a7b8da3efa95cfc1d00" target="_blank" rel="noopener">Clief Notes</a></span>
  <button type="button" id="themeBtn">Dark</button>
</div>

<div class="strip">
  <div class="task">
    <h1 id="title">Workflow Tracer</h1>
    <p id="taskLine">Loading the tree…</p>
    <p><code id="rootLine"></code></p>
  </div>
  <div class="checks" id="checks"></div>
</div>
<div class="why" id="why" hidden></div>

<div class="main">
  <section class="panel" id="treePanel">
    <div class="bar">
      <button id="prev" type="button" aria-label="Previous step">◀</button>
      <button id="play" type="button">Play</button>
      <button id="next" type="button" aria-label="Next step">▶</button>
      <label>Step <span id="stepLabel">0 / 0</span></label>
      <input id="stepRange" type="range" min="0" max="0" value="0" aria-label="Replay position">
      <label>Zoom <input id="zoom" type="range" min="40" max="140" value="100" aria-label="Zoom"></label>
      <button id="modeBtn" type="button">Expand all</button>
      <div class="legend">
        <span><i style="--c:var(--catalog)"></i>catalog</span><span><i style="--c:var(--contract)"></i>contract</span>
        <span><i style="--c:var(--factory)"></i>factory</span><span><i style="--c:var(--product)"></i>product</span>
        <span><i style="--c:var(--tool)"></i>tool</span><span><i style="--c:var(--template)"></i>template</span>
        <span><i style="--c:var(--accent)"></i>read</span>
      </div>
    </div>
    <div class="scroll" id="scroll"><div class="empty" id="treeEmpty">Loading…</div></div>
  </section>
  <aside class="panel" id="stepsPanel">
    <div class="budget">Context loaded (L2–L4) <span id="tokLine">0</span> of 8,000 tokens
      <div class="track"><div class="fill" id="tokFill"></div></div></div>
    <ol class="steps" id="steps"></ol>
    <div class="findings" id="findings" hidden></div>
  </aside>
</div>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  // Theme: follows the system until the button is clicked; the choice stays in this browser.
  const root = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : dark.matches;
  const paintTheme = () => { $('themeBtn').textContent = isDark() ? 'Light' : 'Dark'; };
  try { const t = localStorage.getItem('workflow-tracer-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  paintTheme(); dark.addEventListener('change', paintTheme);
  $('themeBtn').addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('workflow-tracer-theme', root.dataset.theme); } catch (e) {} paintTheme(); });
  // Folders fan out sideways as a bracket; a folder's files stack under it in a drawer, each page as tall as it is heavy.
  const NODE_W = 136, NODE_H = 40, PAD = 24, GAP = 24, DRAWER_IN = 14, DRAWER_GAP = 10, PAGE_GAP = 6, LEVEL_GAP = 46;
  const W = NODE_W, H = NODE_H;
  const pageH = t => Math.min(120, 40 + Math.round((t || 0) / 110)); // 1k tokens ≈ 49px, 8.7k ≈ 119px, capped
  // A folder: tab at the top left, front flap over the lower two thirds. A file: a page with the top-right corner turned, faint rules for its bulk. "N more": a stack of pages.
  const FOLDER = `<path class="shape" d="M0 8 a3 3 0 0 1 3 -3 H44 l7 5 H${W - 3} a3 3 0 0 1 3 3 V${H - 3} a3 3 0 0 1 -3 3 H3 a3 3 0 0 1 -3 -3 Z"/><path class="flap" d="M0 15 H${W} V${H - 3} a3 3 0 0 1 -3 3 H3 a3 3 0 0 1 -3 -3 Z"/>`;
  const FILE = h => { let rules = ''; for (let y = 40; y <= h - 8; y += 8) rules += `M9 ${y} H${W - 24} `; return `<path class="shape" d="M0 0 H${W - 14} L${W} 14 V${h} H0 Z"/><path class="fold" d="M${W - 14} 0 V14 H${W} Z"/><path class="rule" d="M9 ${h - 7} H${W - 60} ${rules}"/>`; };
  const MORE = h => `<path class="back" d="M6 -5 H${W - 8} L${W + 6} 9 V${h - 5} H6 Z"/><path class="shape" d="M0 0 H${W - 14} L${W} 14 V${h} H0 Z"/>`;
  const ROLE_C = { catalog: 'var(--catalog)', contract: 'var(--contract)', factory: 'var(--factory)', product: 'var(--product)', tool: 'var(--tool)', template: 'var(--template)', stage: 'var(--stage)', root: 'var(--catalog)', folder: 'var(--tool)', file: 'var(--line)', more: 'var(--line)' };
  const fmt = n => (n || 0).toLocaleString();

  // Data is inlined by `tracer.py html` (one self-contained file); the fetch is for the page served beside its json.
  let tree, trace;
  try {
    if (window.TRACE_DATA) ({ tree, trace } = window.TRACE_DATA);
    else { tree = await (await fetch('tree.json')).json(); trace = await (await fetch('trace.json')).json(); }
  } catch (e) {
    $('treeEmpty').textContent = 'tree.json or trace.json is missing. Run tracer.py tree, then tracer.py html.';
    return;
  }
  const steps = trace.steps || [];
  const reads = steps.filter(s => s.kind === 'read');
  const named = new Set(steps.filter(s => s.kind === 'named').map(s => s.path)); // inputs the contract names that the walker checked but did not open
  const pending = trace.pending || !steps.length;
  const byPath = new Map();
  (function index(n, parent) { n.parent = parent; byPath.set(n.p, n); (n.c || []).forEach(c => index(c, n)); })(tree.tree);

  // Header
  $('title').textContent = pending ? 'Workflow Tracer (tracing…)' : 'Workflow Tracer';
  $('taskLine').textContent = pending ? 'The walk is running. This page is republished when it ends.' : 'Task: ' + (trace.task || '(none given)');
  $('rootLine').textContent = tree.root + (tree.generated ? '  ·  tree ' + tree.generated : '');
  const SHORT = ['Route', 'Budget', 'Catalog', 'Paths'];
  $('checks').innerHTML = (trace.checks || []).map((c, i) => `<button type="button" class="chk ${c.pass ? 'pass' : 'fail'}" data-i="${i}" title="${c.name}: ${c.note}. Click for the evidence."><b></b><span class="long">${c.name}</span><span class="short">${SHORT[i] || c.name}</span><small>${c.note}</small></button>`).join('');
  // Click a check for its rule and the steps it was judged on. The rules mirror cmd_done in tracer.py.
  const row = s => `<li><code>${esc(s.path)}</code> · ${s.layer}${s.tokens ? ' · ~' + fmt(s.tokens) + ' tok' : ''}${s.kind === 'named' ? ' · named, not opened' : ''}</li>`;
  const WHY = [
    () => { const l2 = trace.totals?.l2_at; const upTo = l2 ? reads.filter(s => s.i <= l2) : reads;
      return `<p>Rule: the entry file plus at most two more reads must reach the first file that says what to do for this task (the L2 contract). More hops means the routing is doing the work the folders should.</p><p>Measured: ${l2 ? `the L2 contract was read ${l2}; ${l2 <= 3 ? 'within' : 'past'} the limit of 3.` : 'no read was assigned L2, so the task has no control point.'}</p><ol>${upTo.map(row).join('')}</ol>`; },
    () => { const w = reads.filter(s => ['L2', 'L3', 'L4'].includes(s.layer)); const sum = w.reduce((a, s) => a + s.tokens, 0);
      return `<p>Rule: the contract and everything it names (L2 to L4) must fit in 8,000 tokens. The routing files (L0, L1) are read on every task and do not count; they add ~${fmt(trace.totals?.tokens - sum)} here.</p><p>Measured: ~${fmt(sum)} tokens across ${w.length} read${w.length === 1 ? '' : 's'}${sum > 8000 ? ', over by ~' + fmt(sum - 8000) : ''}.</p><ul>${w.sort((a, b) => b.tokens - a.tokens).map(row).join('')}</ul>`; },
    () => { const sm = steps.filter(s => s.kind === 'scan' || s.kind === 'miss');
      return `<p>Rule: every hop follows a line in a file the agent already had. A Glob or Grep (scan) or a dead end (miss) means the catalog did not route and the agent had to search.</p><p>Measured: ${sm.length ? `${sm.length} logged.` : 'no scans and no dead ends were logged.'}</p>${sm.length ? '<ul>' + sm.map(s => `<li>${s.kind}: <code>${esc(s.what || s.path)}</code> · ${esc(s.why || '')}</li>`).join('') + '</ul>' : ''}`; },
    () => { const all = steps.filter(s => s.kind === 'read' || s.kind === 'named'); const miss = all.filter(s => !s.exists);
      return `<p>Rule: every path a file pointed the agent at must exist. A named input passes when it is a placeholder (<code>runs/&lt;id&gt;/…</code>) or its folder exists, since the run has not made it yet.</p><p>Measured: ${all.length} path${all.length === 1 ? '' : 's'} checked, ${miss.length ? miss.length + ' did not resolve on disk' : 'all resolved'}${miss.length ? ' (named placeholders still pass)' : ''}.</p>${miss.length ? '<ul>' + miss.map(row).join('') + '</ul>' : ''}`; },
  ];
  let whyOpen = -1;
  $('checks').querySelectorAll('.chk').forEach(btn => btn.addEventListener('click', () => {
    const i = +btn.dataset.i, c = trace.checks[i];
    $('checks').querySelectorAll('.chk').forEach(b => b.classList.remove('open'));
    if (whyOpen === i) { whyOpen = -1; $('why').hidden = true; return; }
    whyOpen = i; btn.classList.add('open');
    $('why').className = 'why ' + (c.pass ? 'pass' : 'fail');
    $('why').innerHTML = `<h3>${c.pass ? 'PASS' : 'FAIL'} · ${c.name}</h3>` + (WHY[i] ? WHY[i]() : `<p>${c.note}</p>`);
    $('why').hidden = false;
  }));
  if ((trace.findings || []).length) { $('findings').hidden = false; $('findings').innerHTML = '<strong>Findings</strong><ul>' + trace.findings.map(f => `<li>${f}</li>`).join('') + '</ul>'; }

  // Which folders are on the route: every ancestor of a read file
  const onRoute = new Set();
  reads.concat(steps.filter(s => s.kind === 'named')).forEach(s => { let n = byPath.get(s.path); while (n) { onRoute.add(n.p); n = n.parent; } });
  const readsAt = new Map(); // path -> [step numbers]
  reads.forEach(s => { if (!readsAt.has(s.path)) readsAt.set(s.path, []); readsAt.get(s.path).push(s.i); });

  let manual = new Map(); // folder path -> open?
  let mode = 'route';
  const isOpen = n => manual.has(n.p) ? manual.get(n.p) : (mode === 'all' || n.p === '.' || (n.parent && n.parent.p === '.' && !reads.length) || onRoute.has(n.p));

  // Layout. Pass 1 (size): decide what each open folder shows and how wide its subtree is: subfolders fan out,
  // files go in the drawer, and in route mode everything off the route folds into one "N more" page. Pass 2 (place):
  // folder, then its drawer straight under it, then the bracket to its subfolders below the drawer. Width is the
  // number of folders on the route; height grows with the files in each drawer, which is the direction a phone scrolls.
  const firstRead = n => (readsAt.get(n.p) || [Infinity])[0];
  function layout() {
    const nodes = [];
    function size(n) {
      n._open = n.d && isOpen(n) && (n.c || []).length;
      if (!n._open) { n._w = NODE_W; n._subs = []; n._files = []; return; }
      let subs = n.c.filter(c => c.d), files = n.c.filter(c => !c.d);
      if (mode === 'route' && reads.length && !manual.has(n.p)) {
        const keepS = subs.filter(c => onRoute.has(c.p)), keepF = files.filter(c => readsAt.has(c.p) || named.has(c.p));
        const rest = subs.filter(c => !keepS.includes(c)).concat(files.filter(c => !keepF.includes(c)));
        if (rest.length && (keepS.length || keepF.length)) {
          subs = keepS;
          const count = rest.reduce((a, c) => a + (c.d ? c.files : 1), 0);
          files = keepF.concat([{ n: `${count} more`, p: n.p + '/…', d: false, r: 'more', b: 0, t: rest.reduce((a, c) => a + (c.t || 0), 0), parent: n }]);
        }
      }
      const rank = f => readsAt.has(f.p) ? firstRead(f) : named.has(f.p) ? 1e6 : f.r === 'more' ? 1e8 : 1e7;
      files.sort((a, b) => rank(a) - rank(b));
      subs.forEach(size);
      n._subs = subs; n._files = files;
      n._w = Math.max(NODE_W + DRAWER_IN, subs.reduce((a, c) => a + c._w, 0) + GAP * Math.max(0, subs.length - 1));
    }
    function place(n, left, y, depth) {
      const item = { n, depth, open: n._open, y, h: NODE_H, kids: [], files: [] };
      nodes.push(item);
      if (!n._open) { item.x = left + NODE_W / 2; item.bottom = y + NODE_H; return item; }
      let dy = y + NODE_H + DRAWER_GAP;
      n._files.forEach(f => { const h = f.r === 'more' ? NODE_H : pageH(f.t); item.files.push({ n: f, y: dy, h, depth: depth + 1, kids: [], files: [] }); dy += h + PAGE_GAP; });
      item.drawerBottom = n._files.length ? dy - PAGE_GAP : y + NODE_H;
      const subsW = n._subs.reduce((a, c) => a + c._w, 0) + GAP * Math.max(0, n._subs.length - 1);
      let cl = left + (n._w - subsW) / 2;
      n._subs.forEach(s => { item.kids.push(place(s, cl, item.drawerBottom + LEVEL_GAP, depth + 1)); cl += s._w + GAP; });
      item.x = item.kids.length ? (item.kids[0].x + item.kids[item.kids.length - 1].x) / 2 : left + NODE_W / 2;
      item.files.forEach(f => { f.x = item.x + DRAWER_IN; nodes.push(f); });
      item.bottom = Math.max(item.drawerBottom, ...item.kids.map(k => k.bottom));
      return item;
    }
    size(tree.tree);
    const root = place(tree.tree, PAD, PAD, 0);
    return { root, nodes, w: PAD * 2 + tree.tree._w + DRAWER_IN, h: root.bottom + PAD };
  }

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const clip = (s, max) => s.length > max ? s.slice(0, max - 1) + '…' : s;
  let cur = reads.length, pos = new Map(), L, zoomTouched = false;
  const phone = matchMedia('(max-width: 860px)');

  function draw() {
    L = layout(); pos = new Map(); L.nodes.forEach(i => pos.set(i.n.p, i));
    // On a phone, fit the bracket to the panel until the person zooms, but never below 70% or the labels go to 8px.
    if (phone.matches && !zoomTouched && $('scroll').clientWidth) $('zoom').value = Math.max(70, Math.min(100, Math.floor(($('scroll').clientWidth - 8) / L.w * 100)));
    const z = +$('zoom').value / 100;
    const shownReads = reads.slice(0, cur);
    const edges = [], boxes = [], route = [], badges = [];
    L.nodes.forEach(it => {
      const n = it.n, on = onRoute.has(n.p);
      if (it.kids.length) {
        // The spine runs down the folder's left edge past its drawer, then a bus across to each subfolder.
        const sx = it.files.length ? it.x - W / 2 + 6 : it.x, midY = it.drawerBottom + LEVEL_GAP / 2;
        it.kids.forEach(k => {
          edges.push(`<path class="edge ${onRoute.has(k.n.p) ? 'on' : ''}" style="--c:${ROLE_C[k.n.r] || 'var(--line)'}" d="M${sx} ${it.y + NODE_H} V${midY} H${k.x} V${k.y}"/>`);
        });
      }
      const col = ROLE_C[n.r] || 'var(--line)';
      const nums = readsAt.get(n.p) || [];
      const readNow = nums.some(i => i <= cur);
      const isNow = cur > 0 && shownReads[cur - 1] && shownReads[cur - 1].path === n.p;
      const kind = n.d ? 'dir' : n.r === 'more' ? 'more' : 'file';
      const cls = ['n', kind, n.r === 'file' ? 'plain' : '', readNow ? 'read' : '', named.has(n.p) && !readNow ? 'named' : '', isNow ? 'now' : '', (n.d && n.c && n.c.length) || nums.length ? 'toggle' : '', (reads.length && !on && !readNow && mode === 'route') ? 'dim' : ''].join(' ');
      const label = n.d && !it.open && n.p !== '.' ? n.n + '/' : n.n;
      const sub = n.d ? (it.open ? '' : `${fmt(n.files)} files · ${fmt(n.t)} tok`) : (n.t ? `${fmt(n.t)} tok` : '');
      const shape = kind === 'dir' ? FOLDER : kind === 'more' ? MORE(it.h) : FILE(it.h);
      const ty = kind === 'dir' ? [27, 37] : sub ? [17, 29] : [24];
      boxes.push(`<g class="${cls}" style="--c:${col}" data-p="${esc(n.p)}" transform="translate(${it.x - NODE_W / 2},${it.y})"><title>${esc(n.p)}${n.d ? '' : ' · ~' + fmt(n.t) + ' tokens'}</title>${shape}` +
        `<text x="9" y="${ty[0]}">${esc(clip(label, 18))}</text>` + (sub ? `<text class="sub" x="9" y="${ty[1]}">${esc(sub)}</text>` : '') + `</g>`);
      if (nums.length) {
        const seen = nums.filter(i => i <= cur);
        if (seen.length) badges.push(`<g class="badge" transform="translate(${it.x + NODE_W / 2 - 4},${it.y - 2})"><circle r="${seen.length > 1 ? 11 : 9}"/><text y="3.5">${seen.join(',')}</text></g>`);
      }
    });
    for (let i = 1; i < shownReads.length; i++) {
      const a = pos.get(shownReads[i - 1].path), b = pos.get(shownReads[i].path);
      if (!a || !b) continue;
      const ax = a.x, ay = a.y + a.h, bx = b.x, by = b.y, c = Math.max(40, Math.abs(by - ay) * .5 + Math.abs(bx - ax) * .15);
      route.push(`<path class="route" marker-end="url(#arrow)" d="M${ax} ${ay} C${ax} ${ay + c}, ${bx} ${by - c}, ${bx} ${by}"/>`);
    }
    $('scroll').innerHTML = `<svg width="${L.w * z}" height="${L.h * z}" viewBox="0 0 ${L.w} ${L.h}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>${edges.join('')}${route.join('')}${boxes.join('')}${badges.join('')}</svg>`;
    // Tap a folder to open or close it; tap a read file to land on its step (on a phone that opens the Steps panel).
    $('scroll').querySelectorAll('.n.toggle').forEach(g => g.addEventListener('click', () => {
      const p = g.dataset.p, n = byPath.get(p);
      if (n && n.d) { manual.set(p, !isOpen(n)); draw(); return; }
      const nums = readsAt.get(p); if (!nums) return;
      cur = reads.findIndex(s => s.i === nums[0]) + 1; draw();
      if (phone.matches) showPanel('steps');
    }));
    $('stepLabel').textContent = `${cur} / ${reads.length}`;
    $('stepRange').max = reads.length; $('stepRange').value = cur;
    const tok = shownReads.filter(s => ['L2', 'L3', 'L4'].includes(s.layer)).reduce((a, s) => a + (s.tokens || 0), 0);
    $('tokLine').textContent = fmt(tok); $('tokFill').style.width = Math.min(100, tok / 80) + '%'; $('tokFill').classList.toggle('over', tok > 8000);
    renderSteps();
    if (cur > 0 && shownReads[cur - 1] && L.w * z > $('scroll').clientWidth) scrollTo(shownReads[cur - 1].path, z);
  }

  function scrollTo(p, z) {
    const it = pos.get(p); if (!it) return;
    const sc = $('scroll');
    sc.scrollTo({ left: it.x * z - sc.clientWidth / 2, top: it.y * z - sc.clientHeight / 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  function renderSteps() {
    if (!steps.length) { $('steps').innerHTML = `<li class="empty">${pending ? 'No reads yet.' : 'Nothing was read.'}</li>`; return; }
    let readIdx = 0;
    $('steps').innerHTML = steps.map(s => {
      const isRead = s.kind === 'read'; if (isRead) readIdx++;
      const k = isRead ? readIdx : readIdx;
      const cls = isRead ? (k === cur ? 'now' : k > cur ? 'future' : '') : (k > cur ? 'future' : '');
      const tag = isRead ? `<span class="tag ${s.layer}">${s.layer}</span>` : s.kind === 'named' ? `<span class="tag ${s.layer}">${s.layer}</span><span class="tag named">named</span>` : `<span class="tag ${s.kind}">${s.kind}</span>`;
      const miss = isRead && s.exists === false ? ' <span class="tag miss">missing</span>' : '';
      return `<li class="${cls}" data-k="${k}" tabindex="0"><span class="num">${isRead ? s.i : '·'}</span><span class="path">${tag}${esc(s.path)}${miss}</span><span class="tok">${isRead ? '~' + fmt(s.tokens) : ''}</span><span class="why">${esc(s.why || '')}${s.via ? ' <em>(via ' + esc(s.via) + ')</em>' : ''}</span></li>`;
    }).join('');
    $('steps').querySelectorAll('li[data-k]').forEach(li => { const go = () => { cur = +li.dataset.k; draw(); }; li.addEventListener('click', go); li.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
    const now = $('steps').querySelector('li.now'); if (now) now.scrollIntoView({ block: 'nearest' });
  }

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = 'Play'; };
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    if (cur >= reads.length) cur = 0;
    $('play').textContent = 'Pause';
    timer = setInterval(() => { if (cur >= reads.length) return stop(); cur++; draw(); }, 1100);
  });
  $('prev').addEventListener('click', () => { stop(); cur = Math.max(0, cur - 1); draw(); });
  $('next').addEventListener('click', () => { stop(); cur = Math.min(reads.length, cur + 1); draw(); });
  $('stepRange').addEventListener('input', e => { stop(); cur = +e.target.value; draw(); });
  $('zoom').addEventListener('input', () => { zoomTouched = true; draw(); });
  $('modeBtn').addEventListener('click', () => { mode = mode === 'route' ? 'all' : 'route'; manual = new Map(); $('modeBtn').textContent = mode === 'route' ? 'Expand all' : 'Route only'; draw(); });
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); });

  // Phone: the Tree / Steps switch shows one panel; picking a step in the list jumps back to the tree.
  function showPanel(which) {
    const onPhone = phone.matches;
    $('treePanel').hidden = onPhone && which !== 'tree';
    $('stepsPanel').hidden = onPhone && which !== 'steps';
    $('segTree').setAttribute('aria-selected', which === 'tree');
    $('segSteps').setAttribute('aria-selected', which === 'steps');
    if (!$('treePanel').hidden) draw();
  }
  $('segTree').addEventListener('click', () => showPanel('tree'));
  $('segSteps').addEventListener('click', () => showPanel('steps'));
  phone.addEventListener('change', () => showPanel($('segSteps').getAttribute('aria-selected') === 'true' ? 'steps' : 'tree'));
  $('steps').addEventListener('click', e => { if (phone.matches && e.target.closest('li[data-k]')) showPanel('tree'); });
  // Pinch on the bracket changes the zoom; one finger still pans through the scroll container.
  const pts = new Map(); let pinch0 = 0, zoom0 = 100;
  const sc = $('scroll');
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  sc.addEventListener('pointerdown', e => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { pinch0 = dist(); zoom0 = +$('zoom').value; } });
  sc.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch0) { e.preventDefault(); zoomTouched = true; const z = Math.round(Math.max(40, Math.min(140, zoom0 * dist() / pinch0))); if (z !== +$('zoom').value) { $('zoom').value = z; draw(); } }
  }, { passive: false });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => sc.addEventListener(t, e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; }));

  draw();
  showPanel('tree');
})();
</script>
